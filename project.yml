name: Truffle
options:
  bundleIdPrefix: com.vanities
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en

settings:
  base:
    # Default team for automatic signing (Xcode Cloud needs one). Forks override it in
    # Config/Signing.xcconfig without touching this file.
    DEVELOPMENT_TEAM: 8Q3RG3ULSU
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Automatic
    # Project-wide so the widget extension's version always matches the app's (App Store validation
    # rejects a mismatch). Xcode Cloud sets the build number for both.
    MARKETING_VERSION: 1.3.0
    CURRENT_PROJECT_VERSION: 1
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES

targets:
  Truffle:
    type: application
    platform: iOS
    sources:
      - path: Truffle
        excludes:
          - "Resources/Info.plist"
          - "Resources/DemoLibrary"
          - "Resources/DemoLibrary/**"
      # The demo's covers and songs, as one folder in the bundle (DemoServer reads them by path).
      - path: Truffle/Resources/DemoLibrary
        type: folder
        buildPhase: resources
      - path: scripts/demo-catalog.json
        buildPhase: resources
    dependencies:
      - target: TruffleWidgets
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_NAME: Truffle
        # iPhone Duo layouts (ArrangementView) need the 27.1+ SDK; see docs/iphone-duo.md.
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos27.1]": "$(inherited) IPHONE_DUO_LAYOUTS"
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator27.1]": "$(inherited) IPHONE_DUO_LAYOUTS"
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos27.2]": "$(inherited) IPHONE_DUO_LAYOUTS"
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator27.2]": "$(inherited) IPHONE_DUO_LAYOUTS"
        PRODUCT_BUNDLE_IDENTIFIER: com.vanities.truffle
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Truffle/Resources/Info.plist
        # CarPlay audio is granted to the team (Earmark ships with it), so device builds carry it too.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Truffle/Resources/Truffle.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Truffle/Resources/Truffle-Device.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Halloween AppIcon-Thanksgiving AppIcon-Christmas AppIcon-NewYear AppIcon-Valentines AppIcon-StPatricks AppIcon-FourthOfJuly"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  # Home Screen widget and the Control Center control. It shares the season, mix and intent sources
  # with the app; its intents' perform() runs in the app's process (they're AudioPlaybackIntents).
  TruffleWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: TruffleWidgets
        excludes:
          - "Info.plist"
      - path: Truffle/Library/Seasons.swift
      - path: Truffle/Library/MixMenu.swift
      - path: Truffle/Views/Components/SeasonColors.swift
      - path: Truffle/Extensions/Logger+Truffle.swift
      - path: Truffle/Intents/MixCatalog.swift
      - path: Truffle/Intents/MediaText.swift
      - path: Truffle/Intents/PlayIntents.swift
      - path: Truffle/Widgets/MixesWidgetView.swift
      - path: Truffle/Resources/Mixes.xcassets
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_NAME: TruffleWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.vanities.truffle.widgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TruffleWidgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  TruffleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TruffleTests
    dependencies:
      - target: Truffle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vanities.truffleTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Truffle.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Truffle"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # Xcode's accessibility audit on every screen of the demo library (`make a11y`). Its own scheme, so
  # `make test` and Xcode Cloud's archive stay as quick as they were.
  TruffleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TruffleUITests
    dependencies:
      - target: Truffle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vanities.truffleUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Truffle

schemes:
  Truffle:
    build:
      targets:
        Truffle: all
        TruffleTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - TruffleTests
    profile:
      config: Release
    archive:
      config: Release
  TruffleAccessibility:
    build:
      targets:
        Truffle: all
        TruffleUITests: [test]
    test:
      config: Debug
      targets:
        - TruffleUITests
